# PoC Data Lake — lakehouse-infra (OpenSpec `poc-data-lake-ducklake`, tareas 2.1–2.3)
#
# Stack 100% local / Portainer: postgres-catalog (catálogo DuckLake), postgres-source
# (origen simulado), Garage nodo único (S3 compatible), prefect-server (orquestación),
# mssql (SQL Server), lake-init (auto-setup) y lake-api (FastAPI + FastMCP).
#
# Todos los puertos y hosts están parametrizados por variables de entorno (ver .env / .env.example).

# Nombre de proyecto explícito. Sin esto se deriva del directorio del repo y los
# volúmenes quedan con otro prefijo (`dulse_*`): el rename del proyecto a medias
# dejaba contenedores `kavos-lake-*` sobre volúmenes `dulse_*`.
name: kavos-lake

services:
  postgres-catalog:
    image: postgres:17.6-bookworm
    container_name: kavos-lake-postgres-catalog
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CATALOG_DB:-ducklake_catalog}
      POSTGRES_USER: ${CATALOG_USER:-ducklake}
      POSTGRES_PASSWORD: ${CATALOG_PASSWORD:-ducklake}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${CATALOG_PORT:-5433}:${CATALOG_INTERNAL_PORT:-5432}"
    volumes:
      - pgcatalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${CATALOG_INTERNAL_PORT:-5432} -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  garage:
    build:
      context: .
      dockerfile: docker/Dockerfile.garage
    image: kavos-lake-garage:v2.4.1
    container_name: kavos-lake-garage
    restart: unless-stopped
    entrypoint: ["/garage"]
    command: ["server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_S3_KEY_ID:-GK0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_S3_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"     # S3 API
      - "${GARAGE_RPC_PORT:-3901}:3901"    # RPC interno
      - "${GARAGE_WEB_PORT:-3902}:3902"    # hosting estático
      - "${GARAGE_ADMIN_PORT:-3903}:3903"  # admin API
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  prefect-server:
    image: prefecthq/prefect:3.6.22-python3.12
    container_name: kavos-lake-prefect-server
    restart: unless-stopped
    entrypoint: ["prefect"]
    command: ["server", "start", "--host", "${PREFECT_BIND_HOST:-0.0.0.0}", "--port", "${PREFECT_INTERNAL_PORT:-4200}"]
    ports:
      - "${PREFECT_PORT:-4200}:${PREFECT_INTERNAL_PORT:-4200}"
    volumes:
      - prefect-data:/root/.prefect
    environment:
      PREFECT_SERVER_API_HOST: "${PREFECT_BIND_HOST:-0.0.0.0}"
      PREFECT_SERVER_API_PORT: "${PREFECT_INTERNAL_PORT:-4200}"
      PREFECT_UI_ENABLED: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:${PREFECT_INTERNAL_PORT:-4200}/api/health', timeout=5).status in (200, 204) else 1)"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  mssql:
    build:
      context: .
      dockerfile: docker/Dockerfile.mssql
    image: kavos-lake-mssql:2022-CU27
    container_name: kavos-lake-mssql
    restart: unless-stopped
    # S1 (bak2parquet): techo físico del motor efímero — cgroup 1600 MB, 1.5 CPUs
    # y límite de proceso 1300 MB; `max server memory=1024` lo fija la herramienta.
    mem_limit: 1600m
    cpus: 1.5
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "1300"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Str0ng!PoC-Local01}"
    ports:
      - "${MSSQL_PORT:-1433}:${MSSQL_INTERNAL_PORT:-1433}"
    volumes:
      - ./mssql-backup:/var/opt/mssql/backup
      # Los datos del motor van a un volumen nombrado: sin esto el
      # directorio es container-local y recrear el servicio (para aplicar
      # mem_limit/cpus) borra las bases restauradas a mano.
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost,${MSSQL_INTERNAL_PORT:-1433} -U ${MSSQL_USER:-sa} -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C -l 5 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  lake-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    image: kavos-lake-pipeline:latest
    container_name: kavos-lake-init
    restart: "no"
    command: ["bash", "scripts/container_init.sh"]
    environment:
      CATALOG_HOST: ${DOCKER_CATALOG_HOST:-postgres-catalog}
      CATALOG_PORT: "${CATALOG_INTERNAL_PORT:-5432}"
      CATALOG_DB: ${CATALOG_DB:-ducklake_catalog}
      CATALOG_USER: ${CATALOG_USER:-ducklake}
      CATALOG_PASSWORD: ${CATALOG_PASSWORD:-ducklake}
      GARAGE_SCHEME: ${GARAGE_SCHEME:-http}
      GARAGE_HOST: ${DOCKER_GARAGE_HOST:-garage}
      GARAGE_S3_PORT: "${GARAGE_S3_PORT:-3900}"
      GARAGE_S3_KEY_ID: ${GARAGE_S3_KEY_ID:-GK0123456789abcdef0123456789abcdef}
      GARAGE_S3_SECRET: ${GARAGE_S3_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_S3_REGION: ${GARAGE_S3_REGION:-garage}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      DUCKLAKE_DATA_PREFIX: ${DUCKLAKE_DATA_PREFIX:-data}
      MSSQL_HOST: ${DOCKER_MSSQL_HOST:-mssql}
      MSSQL_PORT: "${MSSQL_INTERNAL_PORT:-1433}"
      MSSQL_USER: ${MSSQL_USER:-sa}
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Str0ng!PoC-Local01}"
      PREFECT_SCHEME: ${PREFECT_SCHEME:-http}
      PREFECT_HOST: ${DOCKER_PREFECT_HOST:-prefect-server}
      PREFECT_PORT: "${PREFECT_INTERNAL_PORT:-4200}"
      # El bootstrap también ingiere, así que también tiene que dejar la marca
      # de aplicado en el estado persistido. Sin este volumen la marca caía en
      # el filesystem del contenedor: se perdía al terminar lake-init y
      # prefect-serve seguía viendo `applied` vacío, o sea la guarda de
      # antigüedad sin referencia. El path tiene que ser el mismo que usa el
      # scheduler.
      ACQUIRE_STATE_PATH: /workspace/state/.acquire_state.json
      ACQUIRE_FINAL_DIR: /workspace/mssql-backup
    volumes:
      - ./mssql-backup:/workspace/mssql-backup
      - ./mssql-fast:/workspace/mssql-fast
      - ./backups:/workspace/backups
      - serve-state:/workspace/state
    depends_on:
      postgres-catalog:
        condition: service_healthy
      garage:
        condition: service_healthy
      mssql:
        condition: service_healthy

  prefect-serve:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    image: kavos-lake-pipeline:latest
    container_name: kavos-lake-prefect-serve
    restart: unless-stopped
    working_dir: /workspace
    command:
      - /workspace/orchestration/.venv/bin/python
      - orchestration/serve.py
    environment:
      # Mismo catálogo y S3 que lake-init: el flow escribe en el mismo lago.
      CATALOG_HOST: ${DOCKER_CATALOG_HOST:-postgres-catalog}
      CATALOG_PORT: "${CATALOG_INTERNAL_PORT:-5432}"
      CATALOG_DB: ${CATALOG_DB:-ducklake_catalog}
      CATALOG_USER: ${CATALOG_USER:-ducklake}
      CATALOG_PASSWORD: ${CATALOG_PASSWORD:-ducklake}
      GARAGE_SCHEME: ${GARAGE_SCHEME:-http}
      GARAGE_HOST: ${DOCKER_GARAGE_HOST:-garage}
      GARAGE_S3_PORT: "${GARAGE_S3_PORT:-3900}"
      GARAGE_S3_KEY_ID: ${GARAGE_S3_KEY_ID:-GK0123456789abcdef0123456789abcdef}
      GARAGE_S3_SECRET: ${GARAGE_S3_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_S3_REGION: ${GARAGE_S3_REGION:-garage}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      DUCKLAKE_DATA_PREFIX: ${DUCKLAKE_DATA_PREFIX:-data}
      MSSQL_HOST: ${DOCKER_MSSQL_HOST:-mssql}
      MSSQL_PORT: "${MSSQL_INTERNAL_PORT:-1433}"
      MSSQL_USER: ${MSSQL_USER:-sa}
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Str0ng!PoC-Local01}"
      PREFECT_SCHEME: ${PREFECT_SCHEME:-http}
      PREFECT_HOST: ${DOCKER_PREFECT_HOST:-prefect-server}
      PREFECT_PORT: "${PREFECT_INTERNAL_PORT:-4200}"
      # Sin esto el cliente 3.8.8 cae en modo efímero e importa `prefect.server`
      # de su propio venv, incompatible con el FastAPI instalado:
      # `TypeError: Body() got an unexpected keyword argument 'min_items'`.
      # PREFECT_SCHEME/HOST/PORT no los lee el cliente; la URL sí.
      PREFECT_API_URL: http://${DOCKER_PREFECT_HOST:-prefect-server}:${PREFECT_INTERNAL_PORT:-4200}/api
      # Camino de datos dentro de la imagen (venvs pre-construidos).
      BRONZE_PYTHON: /workspace/bronze/.venv/bin/python
      BAK2PARQUET_OUT: /workspace/parquet-out
      PYTHONPATH: /workspace/bak2parquet/src
      # Estado persistido: si esto se pierde, la guarda de antigüedad olvida
      # cuál fue el último backup aplicado y podría volver a cargar uno viejo.
      ORCH_RESTORE_MARK: /workspace/state/.last_restore.json
      ACQUIRE_STATE_PATH: /workspace/state/.acquire_state.json
      # Adquisición (spec bak-acquire). La allowlist y las credenciales vienen
      # de .env: sin ACQUIRE_IMAP_USER y ACQUIRE_LINK_HOSTS la tarea se salta.
      ACQUIRE_FINAL_DIR: /workspace/mssql-backup
      ACQUIRE_INCOMING_DIR: /workspace/mssql-backup/.incoming
      ACQUIRE_POLL_HOURS: "${ACQUIRE_POLL_HOURS:-4}"
      ACQUIRE_SINCE_DAYS: "${ACQUIRE_SINCE_DAYS:-3}"
      ACQUIRE_KEEP_BACKUPS: "${ACQUIRE_KEEP_BACKUPS:-1}"
      ACQUIRE_MIN_WINDOW_SECONDS: "${ACQUIRE_MIN_WINDOW_SECONDS:-1800}"
      ACQUIRE_IMAP_USER: "${ACQUIRE_IMAP_USER:-}"
      ACQUIRE_IMAP_APP_PASSWORD: "${ACQUIRE_IMAP_APP_PASSWORD:-}"
      ACQUIRE_FROM: "${ACQUIRE_FROM:-info@finnegans.com.ar}"
      ACQUIRE_SUBJECT_PATTERN: "${ACQUIRE_SUBJECT_PATTERN:-Backup de Base de Datos Disponible}"
      ACQUIRE_LINK_HOSTS: "${ACQUIRE_LINK_HOSTS:-}"
    volumes:
      - ./mssql-backup:/workspace/mssql-backup
      - serve-state:/workspace/state
      - serve-parquet:/workspace/parquet-out
    depends_on:
      postgres-catalog:
        condition: service_healthy
      garage:
        condition: service_healthy
      mssql:
        condition: service_healthy
      prefect-server:
        condition: service_healthy

  lake-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    # Sin `image:` el nombre salía del directorio del repo (dulse-lake-api), así
    # que el rename del proyecto quedaba a medias: el contenedor se llamaba
    # kavos-lake-api y la imagen dulse-lake-api. Es el único servicio que
    # buildea sin nombre fijo; el resto usa kavos-lake-*.
    image: kavos-lake-api:latest
    container_name: kavos-lake-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:${API_INTERNAL_PORT:-8000}"
    environment:
      API_BIND_HOST: ${API_BIND_HOST:-0.0.0.0}
      API_INTERNAL_PORT: "${API_INTERNAL_PORT:-8000}"
      CATALOG_HOST: ${DOCKER_CATALOG_HOST:-postgres-catalog}
      CATALOG_PORT: "${CATALOG_INTERNAL_PORT:-5432}"
      CATALOG_DB: ${CATALOG_DB:-ducklake_catalog}
      CATALOG_USER: ${CATALOG_USER:-ducklake}
      CATALOG_PASSWORD: ${CATALOG_PASSWORD:-ducklake}
      GARAGE_SCHEME: ${GARAGE_SCHEME:-http}
      GARAGE_HOST: ${DOCKER_GARAGE_HOST:-garage}
      GARAGE_S3_PORT: "${GARAGE_S3_PORT:-3900}"
      GARAGE_S3_KEY_ID: ${GARAGE_S3_KEY_ID:-GK0123456789abcdef0123456789abcdef}
      GARAGE_S3_SECRET: ${GARAGE_S3_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_S3_REGION: ${GARAGE_S3_REGION:-garage}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
      DUCKLAKE_DATA_PREFIX: ${DUCKLAKE_DATA_PREFIX:-data}
      # Auth obligatoria (fail-closed): API keys para servicio/agentes y JWT para personas.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_JWT_TTL_MINUTES: ${AUTH_JWT_TTL_MINUTES:-60}
      # Credenciales: base propia, ya no hereda host/puerto/usuario/password del
      # catálogo. Dentro de la red de compose el host es el servicio y el puerto
      # el interno.
      AUTH_DB_HOST: ${DOCKER_AUTH_DB_HOST:-postgres-catalog}
      AUTH_DB_PORT: "${AUTH_DB_INTERNAL_PORT:-5432}"
      AUTH_DB_USER: ${AUTH_DB_USER:-ducklake}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-ducklake}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-kavos_lake_auth}
      # Legado: el arranque las importa a la base una única vez y después no
      # se leen. Se pueden vaciar cuando el panel ya tiene los usuarios.
      AUTH_API_KEYS: ${AUTH_API_KEYS:-}
      AUTH_USERS: ${AUTH_USERS:-}
      # CORS: esquema, hosts y puerto por separado (la aplicación deriva cors_allow_origins)
      CORS_SCHEME: ${CORS_SCHEME:-http}
      CORS_HOSTS: ${CORS_HOSTS:-localhost,127.0.0.1}
      CORS_PORT: "${CORS_PORT:-8000}"
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
    depends_on:
      postgres-catalog:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${API_INTERNAL_PORT:-8000}/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  mssql-data:
  pgcatalog-data:
  garage-meta:
  garage-data:
  prefect-data:
  # Estado y Parquet del scheduler: sobreviven a recrear el contenedor. Si el
  # estado se perdiera, la guarda de antigüedad de la adquisición olvidaría el
  # último backup aplicado.
  serve-state:
  serve-parquet:
