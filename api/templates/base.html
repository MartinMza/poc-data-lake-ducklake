<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Panel de acceso{% endblock %} · Dulse Data Lake</title>
<script src="/static/htmx.min.js" defer></script>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --card-2: #1e222b; --line: #2b3140;
    --txt: #e8ecf3; --dim: #98a2b3; --acc: #4f9cf9; --ok: #3ddc97;
    --warn: #f2b544; --bad: #ff6b6b; --r: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--acc); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  header.top {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--card);
  }
  .brand { font-weight: 650; letter-spacing: .2px; }
  .brand span { color: var(--dim); font-weight: 400; }
  nav.tabs { display: flex; gap: 4px; margin-left: 8px; }
  nav.tabs a {
    padding: 7px 12px; border-radius: 8px; color: var(--dim); font-size: 14px;
  }
  nav.tabs a:hover { background: var(--card-2); text-decoration: none; color: var(--txt); }
  nav.tabs a.active { background: var(--card-2); color: var(--txt); font-weight: 600; }
  .who { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 14px; }
  main { max-width: 1060px; margin: 0 auto; padding: 26px 22px 60px; }
  .narrow { max-width: 470px; }
  h1 { font-size: 21px; margin: 0 0 6px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  p.lead { color: var(--dim); margin: 0 0 22px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 18px; margin-bottom: 18px;
  }
  label { display: block; font-size: 13px; color: var(--dim); margin: 0 0 5px; }
  input[type=text], input[type=password], input[type=number], select {
    width: 100%; padding: 9px 11px; border-radius: 8px; color: var(--txt);
    background: var(--bg); border: 1px solid var(--line); font-size: 14px;
    font-family: inherit;
  }
  input:focus, select:focus { outline: 2px solid var(--acc); outline-offset: 1px; border-color: var(--acc); }
  .field { margin-bottom: 14px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > * { flex: 1 1 160px; }
  button, .btn {
    display: inline-block; padding: 9px 15px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card-2); color: var(--txt);
    font: inherit; font-size: 14px; line-height: 1.2;
  }
  button:hover, .btn:hover { border-color: var(--acc); text-decoration: none; }
  button.primary { background: var(--acc); border-color: var(--acc); color: #06101f; font-weight: 650; }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--bad); border-color: #4a2630; }
  button.danger:hover { border-color: var(--bad); }
  button.small, .btn.small { padding: 5px 9px; font-size: 13px; }
  button.ghost { background: transparent; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--dim); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line);
  }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  td.actions { text-align: right; white-space: nowrap; }
  td.actions form { display: inline; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .badge.ok { color: var(--ok); border-color: #1f5c44; }
  .badge.warn { color: var(--warn); border-color: #5c4a1f; }
  .badge.bad { color: var(--bad); border-color: #5c1f26; }
  .alert { padding: 11px 13px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
  .alert.error { background: #2a161a; border: 1px solid #5c1f26; color: #ffc9c9; }
  .alert.ok { background: #12251c; border: 1px solid #1f5c44; color: #b9f5d8; }
  .alert.info { background: #14202e; border: 1px solid #24405c; color: #c7ddf5; }
  .secret {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: #0b1a12; border: 1px dashed #2f7a57; border-radius: 8px;
    padding: 12px; margin: 10px 0 4px;
  }
  .secret code { font-size: 14px; word-break: break-all; color: var(--ok); flex: 1 1 260px; }
  .hint { font-size: 13px; color: var(--dim); margin: 6px 0 0; }
  .empty { color: var(--dim); font-size: 14px; padding: 14px 4px; }
  .foot { margin-top: 26px; font-size: 13px; color: var(--dim); }
  .htmx-request .hx-busy { opacity: .6; }
  .htmx-indicator { display: none; font-size: 13px; color: var(--dim); }
  .htmx-request .htmx-indicator { display: inline; }
</style>
</head>
<body>
{% if user %}
<header class="top">
  <div class="brand">Dulse <span>· panel de acceso</span></div>
  <nav class="tabs">
    <a href="/auth/panel" class="{% if tab == 'keys' %}active{% endif %}">Mis API keys</a>
    {% if user.role == 'superadmin' %}
    <a href="/auth/panel/usuarios" class="{% if tab == 'users' %}active{% endif %}">Usuarios</a>
    {% endif %}
    <a href="/auth/panel/password" class="{% if tab == 'password' %}active{% endif %}">Mi contraseña</a>
  </nav>
  <div class="who">
    <span class="badge {% if user.role == 'superadmin' %}ok{% endif %}">{{ user.username }} · {{ user.role }}</span>
    <form method="post" action="/auth/panel/salir"><button class="small ghost" type="submit">Salir</button></form>
  </div>
</header>
{% endif %}
<main class="{% block mainclass %}{% endblock %}">
{% block body %}{% endblock %}
</main>
</body>
</html>
