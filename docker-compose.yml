# PoC Data Lake — lakehouse-infra (OpenSpec `poc-data-lake-ducklake`, tareas 2.1–2.3)
#
# Stack 100% local / Portainer: postgres-catalog (catálogo DuckLake), postgres-source
# (origen simulado), Garage nodo único (S3 compatible), prefect-server (orquestación),
# mssql (SQL Server), lake-init (auto-setup) y lake-api (FastAPI + FastMCP).
#
# Todos los puertos y hosts están parametrizados por variables de entorno (ver .env / .env.example).

services:
  postgres-catalog:
    image: postgres:17.6-bookworm
    container_name: dulse-postgres-catalog
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CATALOG_DB:-ducklake_catalog}
      POSTGRES_USER: ${CATALOG_USER:-ducklake}
      POSTGRES_PASSWORD: ${CATALOG_PASSWORD:-ducklake}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${CATALOG_PORT:-5433}:${CATALOG_INTERNAL_PORT:-5432}"
    volumes:
      - pgcatalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${CATALOG_INTERNAL_PORT:-5432} -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-source:
    image: postgres:17.6-bookworm
    container_name: dulse-postgres-source
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SOURCE_DB:-source_db}
      POSTGRES_USER: ${SOURCE_USER:-source_user}
      POSTGRES_PASSWORD: ${SOURCE_PASSWORD:-source_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${SOURCE_PORT:-5434}:${SOURCE_INTERNAL_PORT:-5432}"
    volumes:
      - pgsource-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${SOURCE_INTERNAL_PORT:-5432} -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  garage:
    build:
      context: .
      dockerfile: docker/Dockerfile.garage
    image: dulse-garage:v2.4.1
    container_name: dulse-garage
    restart: unless-stopped
    entrypoint: ["/garage"]
    command: ["server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_S3_KEY_ID:-GK0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_S3_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"     # S3 API
      - "${GARAGE_RPC_PORT:-3901}:3901"    # RPC interno
      - "${GARAGE_WEB_PORT:-3902}:3902"    # hosting estático
      - "${GARAGE_ADMIN_PORT:-3903}:3903"  # admin API
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  prefect-server:
    image: prefecthq/prefect:3.6.22-python3.12
    container_name: dulse-prefect-server
    restart: unless-stopped
    entrypoint: ["prefect"]
    command: ["server", "start", "--host", "${PREFECT_BIND_HOST:-0.0.0.0}", "--port", "${PREFECT_INTERNAL_PORT:-4200}"]
    ports:
      - "${PREFECT_PORT:-4200}:${PREFECT_INTERNAL_PORT:-4200}"
    volumes:
      - prefect-data:/root/.prefect
    environment:
      PREFECT_SERVER_API_HOST: "${PREFECT_BIND_HOST:-0.0.0.0}"
      PREFECT_SERVER_API_PORT: "${PREFECT_INTERNAL_PORT:-4200}"
      PREFECT_UI_ENABLED: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:${PREFECT_INTERNAL_PORT:-4200}/api/health', timeout=5).status in (200, 204) else 1)"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  mssql:
    build:
      context: .
      dockerfile: docker/Dockerfile.mssql
    image: dulse-mssql:2022-CU27
    container_name: dulse-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Str0ng!PoC-Local01}"
    ports:
      - "${MSSQL_PORT:-1433}:${MSSQL_INTERNAL_PORT:-1433}"
    volumes:
      - ./mssql-backup:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost,${MSSQL_INTERNAL_PORT:-1433} -U ${MSSQL_USER:-sa} -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C -l 5 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  lake-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
    image: dulse-lake-pipeline:latest
    container_name: dulse-lake-init
    restart: "no"
    command: ["bash", "scripts/container_init.sh"]
    environment:
      CATALOG_HOST: ${DOCKER_CATALOG_HOST:-postgres-catalog}
      CATALOG_PORT: "${CATALOG_INTERNAL_PORT:-5432}"
      CATALOG_DB: ${CATALOG_DB:-ducklake_catalog}
      CATALOG_USER: ${CATALOG_USER:-ducklake}
      CATALOG_PASSWORD: ${CATALOG_PASSWORD:-ducklake}
      SOURCE_HOST: ${DOCKER_SOURCE_HOST:-postgres-source}
      SOURCE_PORT: "${SOURCE_INTERNAL_PORT:-5432}"
      SOURCE_DB: ${SOURCE_DB:-source_db}
      SOURCE_USER: ${SOURCE_USER:-source_user}
      SOURCE_PASSWORD: ${SOURCE_PASSWORD:-source_password}
      GARAGE_SCHEME: ${GARAGE_SCHEME:-http}
      GARAGE_HOST: ${DOCKER_GARAGE_HOST:-garage}
      GARAGE_S3_PORT: "${GARAGE_S3_PORT:-3900}"
      GARAGE_S3_KEY_ID: ${GARAGE_S3_KEY_ID:-GK0123456789abcdef0123456789abcdef}
      GARAGE_S3_SECRET: ${GARAGE_S3_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_S3_REGION: ${GARAGE_S3_REGION:-garage}
      DUCKLAKE_DATA_PATH: ${DUCKLAKE_DATA_PATH:-s3://lakehouse/data/}
      MSSQL_HOST: ${DOCKER_MSSQL_HOST:-mssql}
      MSSQL_PORT: "${MSSQL_INTERNAL_PORT:-1433}"
      MSSQL_USER: ${MSSQL_USER:-sa}
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Str0ng!PoC-Local01}"
      PREFECT_SCHEME: ${PREFECT_SCHEME:-http}
      PREFECT_HOST: ${DOCKER_PREFECT_HOST:-prefect-server}
      PREFECT_PORT: "${PREFECT_INTERNAL_PORT:-4200}"
      SEED_SCALE: ${SEED_SCALE:-demo}
    volumes:
      - ./mssql-backup:/workspace/mssql-backup
      - ./mssql-fast:/workspace/mssql-fast
      - ./backups:/workspace/backups
    depends_on:
      postgres-catalog:
        condition: service_healthy
      postgres-source:
        condition: service_healthy
      garage:
        condition: service_healthy
      mssql:
        condition: service_healthy

  lake-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: dulse-lake-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:${API_INTERNAL_PORT:-8000}"
    environment:
      API_BIND_HOST: ${API_BIND_HOST:-0.0.0.0}
      API_INTERNAL_PORT: "${API_INTERNAL_PORT:-8000}"
      CATALOG_HOST: ${DOCKER_CATALOG_HOST:-postgres-catalog}
      CATALOG_PORT: "${CATALOG_INTERNAL_PORT:-5432}"
      CATALOG_DB: ${CATALOG_DB:-ducklake_catalog}
      CATALOG_USER: ${CATALOG_USER:-ducklake}
      CATALOG_PASSWORD: ${CATALOG_PASSWORD:-ducklake}
      GARAGE_SCHEME: ${GARAGE_SCHEME:-http}
      GARAGE_HOST: ${DOCKER_GARAGE_HOST:-garage}
      GARAGE_S3_PORT: "${GARAGE_S3_PORT:-3900}"
      GARAGE_S3_KEY_ID: ${GARAGE_S3_KEY_ID:-GK0123456789abcdef0123456789abcdef}
      GARAGE_S3_SECRET: ${GARAGE_S3_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_S3_REGION: ${GARAGE_S3_REGION:-garage}
      DUCKLAKE_DATA_PATH: ${DUCKLAKE_DATA_PATH:-s3://lakehouse/data/}
      # Auth obligatoria (fail-closed): API keys para servicio/agentes y JWT para personas.
      AUTH_API_KEYS: ${AUTH_API_KEYS:-}
      AUTH_USERS: ${AUTH_USERS:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_JWT_TTL_MINUTES: ${AUTH_JWT_TTL_MINUTES:-60}
    depends_on:
      postgres-catalog:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${API_INTERNAL_PORT:-8000}/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  pgcatalog-data:
  pgsource-data:
  garage-meta:
  garage-data:
  prefect-data:
